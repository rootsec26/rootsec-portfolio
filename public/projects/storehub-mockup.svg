<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" fill="none" role="img" aria-label="StoreHub Multi-Tenant E-Commerce mockup">
  <defs>
    <linearGradient id="sh-bg" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1018"/>
      <stop offset="0.55" stop-color="#080a0f"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="sh-accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="sh-glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sh-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="url(#sh-bg)"/>
  <rect width="1280" height="800" fill="url(#sh-grid)"/>
  <ellipse cx="900" cy="130" rx="380" ry="190" fill="url(#sh-glow)"/>

  <!-- window chrome -->
  <rect width="1280" height="52" fill="#0c0e13"/>
