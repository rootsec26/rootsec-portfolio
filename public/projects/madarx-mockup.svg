    <text x="288" y="264" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800" fill="#f8fafc">3.82</text>
    <rect x="288" y="278" width="140" height="6" rx="3" fill="url(#mx-accent)"/>
