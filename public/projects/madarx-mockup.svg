    <rect x="36" y="253" width="8" height="8" rx="2"/><rect x="54" y="252" width="84" height="10" rx="5" fill="#334155"/>
    <rect x="36" y="301" width="8" height="8" rx="2"/><rect x="54" y="300" width="140" height="10" rx="5" fill="#334155"/>
    <rect x="36" y="349" width="8" height="8" rx="2"/><rect x="54" y="348" width="102" height="10" rx="5" fill="#334155"/>
    <rect x="36" y="397" width="8" height="8" rx="2"/><rect x="54" y="396" width="76" height="10" rx="5" fill="#334155"/>
    <rect x="36" y="445" width="8" height="8" rx="2"/><rect x="54" y="444" width="126" height="10" rx="5" fill="#334155"/>
