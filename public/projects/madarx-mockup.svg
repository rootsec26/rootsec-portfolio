    <rect x="948" y="399" width="120" height="10" rx="5" fill="#334155"/>
    <rect x="1148" y="396" width="56" height="18" rx="9" fill="#22d3ee" fill-opacity="0.25"/>
    <rect x="932" y="438" width="288" height="44" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>
    <rect x="948" y="455" width="152" height="10" rx="5" fill="#334155"/>
    <rect x="1148" y="452" width="56" height="18" rx="9" fill="#818cf8" fill-opacity="0.28"/>
    <rect x="932" y="494" width="288" height="44" rx="10" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>
    <rect x="948" y="511" width="96" height="10" rx="5" fill="#334155"/>
    <rect x="1148" y="508" width="56" height="18" rx="9" fill="#22d3ee" fill-opacity="0.25"/>
  </g>

