    <rect x="308" y="686" width="180" height="12" rx="6" fill="#334155"/>
    <rect x="308" y="710" width="120" height="10" rx="5" fill="#1e293b"/>
    <rect x="620" y="642" width="300" height="106" rx="12" fill="#818cf8" fill-opacity="0.06" stroke="#818cf8" stroke-opacity="0.22"/>
    <text x="640" y="672" font-family="ui-monospace, monospace" font-size="11" fill="#a5b4fc">11:00 — 12:30</text>
    <rect x="640" y="686" width="200" height="12" rx="6" fill="#334155"/>
    <rect x="640" y="710" width="96" height="10" rx="5" fill="#1e293b"/>
    <rect x="952" y="642" width="268" height="106" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="972" y="672" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">14:00 — 15:30</text>
