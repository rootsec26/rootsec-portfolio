<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" fill="none" role="img" aria-label="Madar-X Academic Ecosystem mockup">
  <defs>
    <linearGradient id="mx-bg" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08141a"/>
      <stop offset="0.55" stop-color="#060a0e"/>
      <stop offset="1" stop-color="#04070a"/>
    </linearGradient>
    <linearGradient id="mx-accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="mx-area" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="mx-glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mx-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="url(#mx-bg)"/>
  <rect width="1280" height="800" fill="url(#mx-grid)"/>
  <ellipse cx="960" cy="120" rx="360" ry="190" fill="url(#mx-glow)"/>

  <!-- window chrome -->
  <rect width="1280" height="52" fill="#0a0f13"/>
  <rect y="51" width="1280" height="1" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="26" cy="26" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="26" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="26" r="6" fill="#27c93f"/>
  <rect x="446" y="15" width="388" height="22" rx="11" fill="#11181d" stroke="#ffffff" stroke-opacity="0.06"/>
  <circle cx="463" cy="26" r="3.5" fill="#22d3ee"/>
  <text x="476" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#64748b">https://madarx.vercel.app</text>

  <!-- sidebar -->
