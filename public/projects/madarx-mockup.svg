  <path d="M288 512 L360 486 L432 496 L504 452 L576 462 L648 418 L720 430 L792 386 L864 366 L864 536 L288 536 Z" fill="url(#mx-area)"/>
  <path d="M288 512 L360 486 L432 496 L504 452 L576 462 L648 418 L720 430 L792 386 L864 366" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
